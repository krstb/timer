<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Standardfarbe: Schwarz (für hellen Modus) */
    path { fill: #000000; }

    /* Wenn Dark Mode aktiv ist: Farbe zu Weiß ändern */
    @media (prefers-color-scheme: dark) {
      path { fill: #ffffff; }
    }
  </style>
  <circle cx="50" cy="50" r="40" />
</svg>